<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>wnet</title>
    <!-- Importando fontes premium -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #000000;
            --card-bg: rgba(28, 28, 30, 0.8);
            --accent: #0071e3;
            --text: #f5f5f7;
            --text-dim: #86868b;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 50%, #1c1c1e 0%, #000000 100%);
        }

        html {
            height: -webkit-fill-available;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% -10%, rgba(0, 113, 227, 0.2), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            width: 92%;
            max-width: 400px;
            padding: 40px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 36px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: containerAppear 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1;
        }

        @keyframes containerAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            animation: logoFloat 6s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .logo-container {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: #fff;
            padding: 2px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 2;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130%;
            height: 130%;
            background: radial-gradient(circle, rgba(0, 113, 227, 0.3), transparent 70%);
            z-index: 1;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #fff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: var(--text-dim);
            line-height: 1.4;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .download-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 113, 227, 0.3);
        }

        .download-btn:active {
            transform: scale(0.96);
            background: #0062c4;
        }

        .btn-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .info-item {
            background: var(--glass);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .info-item i {
            font-size: 16px;
            color: var(--accent);
            margin-bottom: 6px;
            display: block;
            animation: iconBounce 2.5s infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .info-label {
            display: block;
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
        }

        .info-value {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .status-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .status-card {
            background: #1c1c1e;
            padding: 32px 24px;
            border-radius: 28px;
            border: 1px solid var(--border);
            text-align: center;
            width: 80%;
            max-width: 300px;
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .status-overlay.active {
            display: flex;
            opacity: 1;
        }

        .status-overlay.active .status-card {
            transform: scale(1);
        }

        .loader {
            width: 44px;
            height: 44px;
            border: 3px solid var(--glass);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <div class="logo-container">
                <img src="https://ok-moccasin-fxxuilq23t.edgeone.app/bbc30160-49ba-11f1-9adb-11432caa6012.png" alt="wnet Logo">
            </div>
        </div>
        
        <h1>wnet</h1>
        <p>Conectividade de elite. Seguro, rápido e privado.</p>

        <button id="downloadBtn" class="download-btn">
            <span class="btn-shine"></span>
            <i class="fa-solid fa-cloud-arrow-down"></i>
            Baixar Agora
        </button>
        
        <div class="info-grid">
            <div class="info-item">
                <i class="fa-solid fa-code-branch"></i>
                <span class="info-label">Versão</span>
                <span class="info-value">2.0 Pro</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-weight-hanging"></i>
                <span class="info-label">Tamanho</span>
                <span class="info-value">60 MB</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span class="info-label">Segurança</span>
                <span class="info-value">Verificado</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span class="info-label">Sistema</span>
                <span class="info-value">Android 6.0+</span>
            </div>
        </div>

        <div class="footer">
            &copy; 2024 wnet. Engineered for privacy.
        </div>
    </div>

    <div id="statusOverlay" class="status-overlay">
        <div class="status-card">
            <div id="loader" class="loader"></div>
            <h2 id="statusTitle" style="font-size: 20px; margin-bottom: 8px;">Iniciando...</h2>
            <p id="statusDesc" style="font-size: 14px; color: var(--text-dim);">Preparando seu download seguro.</p>
        </div>
    </div>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const overlay = document.getElementById('statusOverlay');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const loader = document.getElementById('loader');
        
        // LINK DO APK INFALÍVEL
        const APK_URL = "https://apk.dtunnel.com.br/build/6de24fd96f/4.6.2_base_pro.apk";

        downloadBtn.addEventListener('click', function() {
            // 1. Feedback Visual Imediato
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 10);

            // 2. Lógica de Download Automático Infalível
            const triggerDownload = () => {
                const link = document.createElement('a');
                link.href = APK_URL;
                link.download = "wnet_pro.apk";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Executa o download imediatamente
            triggerDownload();

            // 3. Sequência de Status para Experiência do Usuário
            setTimeout(() => {
                statusTitle.textContent = "Download Iniciado";
                statusDesc.textContent = "O arquivo está sendo transferido.";
                loader.style.borderColor = "transparent";
                loader.style.borderTopColor = "#34c759";
                loader.innerHTML = '<i class="fa-solid fa-check" style="color: #34c759; font-size: 20px; margin-top: 10px;"></i>';
                loader.style.animation = "none";
            }, 1500);

            // Fecha o overlay automaticamente
            setTimeout(() => {
                overlay.classList.remove('active');
                setTimeout(() => {
                    overlay.style.display = 'none';
                    // Reset para próxima vez
                    statusTitle.textContent = "Iniciando...";
                    statusDesc.textContent = "Preparando seu download seguro.";
                    loader.innerHTML = "";
                    loader.style.animation = "spin 0.8s linear infinite";
                    loader.style.borderColor = "var(--glass)";
                    loader.style.borderTopColor = "var(--accent)";
                }, 4000);
            }, 4000);
        });
    </script> 
</body>
</html>
